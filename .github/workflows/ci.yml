name: CI

on:
  push:
    branches:
      - "feat/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Lint owned application files
        run: >-
          npx eslint
          src/components/app-shell.tsx
          src/components/product-card.tsx
          src/hooks/useAdmin.ts
          src/hooks/useContentStudio.ts
          src/hooks/useDashboard.ts
          src/hooks/useFavorites.ts
          src/hooks/usePersonalRadar.ts
          src/hooks/useProductDetail.ts
          src/hooks/useProductRadar.ts
          src/lib/admin-csv.ts
          src/routes/auth.tsx
          src/routes/_authenticated/admin.tsx
          src/routes/_authenticated/configuracoes.tsx
          src/routes/_authenticated/dashboard.tsx
          src/routes/_authenticated/estudio.tsx
          src/routes/_authenticated/favoritos.tsx
          src/routes/_authenticated/meu-radar.tsx
          src/routes/_authenticated/onboarding.tsx
          'src/routes/_authenticated/produto.$id.tsx'
          src/routes/_authenticated/radar.tsx
          src/types/product.ts
          --max-warnings=0

      - name: Production build
        run: npm run build
