name: CI

on:
  push:
    branches:
      - "feat/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Lint owned application files
        run: >-
          npx eslint
          src/components/admin-plan-management.tsx
          src/components/app-shell.tsx
          src/components/product-card.tsx
          src/hooks/useAdmin.ts
          src/hooks/useBilling.ts
          src/hooks/useContentStudio.ts
          src/hooks/useDashboard.ts
          src/hooks/useFavorites.ts
          src/hooks/useMarketIntelligence.ts
          src/hooks/usePersonalRadar.ts
          src/hooks/useProductDetail.ts
          src/hooks/useProductRadar.ts
          src/hooks/usePlanUsage.ts
          src/lib/admin-csv.ts
          src/lib/api-auth.server.ts
          src/lib/ai-content-schema.ts
          src/lib/ai-content.server.ts
          src/lib/billing.server.ts
          src/lib/http-security.ts
          src/lib/market-intelligence.ts
          src/lib/product-ingest-schema.ts
          src/lib/product-ingest.server.ts
          src/lib/request-body.server.ts
          src/lib/usage.server.ts
          src/routes/api/admin/subscriptions.ts
          src/routes/api/billing/cancel.ts
          src/routes/api/billing/checkout.ts
          src/routes/api/billing/status.ts
          src/routes/api/billing/sync.ts
          src/routes/api/ai-content.ts
          src/routes/api/health.ts
          src/routes/api/usage.ts
          src/routes/api/webhooks/mercado-pago.ts
          src/routes/api/integrations/products.ts
          src/routes/auth.tsx
          src/routes/transparencia.tsx
          src/routes/_authenticated/admin.tsx
          src/routes/_authenticated/configuracoes.tsx
          src/routes/_authenticated/dashboard.tsx
          src/routes/_authenticated/estudio.tsx
          src/routes/_authenticated/favoritos.tsx
          src/routes/_authenticated/inteligencia.tsx
          src/routes/_authenticated/meu-radar.tsx
          src/routes/_authenticated/onboarding.tsx
          src/routes/_authenticated/plano.tsx
          'src/routes/_authenticated/produto.$id.tsx'
          src/routes/_authenticated/radar.tsx
          src/types/product.ts
          src/server.ts
          --max-warnings=0

      - name: Production build
        run: npm run build
